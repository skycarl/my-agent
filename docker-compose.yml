services:

  app:
    container_name: app
    build: 
      context: .
      dockerfile: .docker/Dockerfile
    command: bash -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --use-colors"
    tty: true
    ports:
      # Loopback only: the bots reach the app as http://app:8001 over app-network,
      # so nothing needs it on the LAN. Test from the laptop via SSH (see test-pi skill).
      - 127.0.0.1:8001:8001
    restart: always
    networks:
      - app-network
    volumes:
      - .:/app/workspace
    env_file:
      - .env
    environment:
      - STORAGE_PATH=/app/workspace/storage
      - GARDEN_DB_PATH=/app/workspace/storage/garden_db.json
      - TERM=xterm-256color
      - FORCE_COLOR=1

  telegram-bot:
    container_name: telegram_bot
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: bash -c "uv run python -m telegram_bot.main"
    tty: true
    depends_on:
      - app
    restart: always
    networks:
      - app-network
    volumes:
      - .:/app/workspace
    env_file:
      - .env
    environment:
      - STORAGE_PATH=/app/workspace/storage
      - TERM=xterm-256color
      - FORCE_COLOR=1
      - GIT_COMMIT=${GIT_COMMIT:-}
      - GIT_COMMIT_MESSAGE=${GIT_COMMIT_MESSAGE:-}

  email-sink:
    container_name: email_sink
    build: 
      context: .
      dockerfile: .docker/Dockerfile
    command: bash -c "uv run python -m email_sink.main"
    tty: true
    depends_on:
      - app
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - TERM=xterm-256color
      - FORCE_COLOR=1

networks:
  app-network:
    driver: bridge